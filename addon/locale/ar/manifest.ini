summary = "DictionaryDisplayLite"
description = """تعلب DictionaryDisplayLite على جعل إدارة قواميس النطق في NVDA أسرع وأكثر هدوءاً. فهي تختصر إعلانات القوائم، وتضيف قائمة سريعة، وتقدم محرراً مخصصاً لقواميس الصوت مع ميزة البحث، والتحقق، وإعادة ترتيب العناصر.

اختصارات لوحة المفاتيح:
Control+Shift+D
نقرة واحدة : فتح مربع حوار قواميس النطق
نقرتان : فتح مربع حوار القاموس الافتراضي
ثلاث نقرات (أو أكثر) : فتح مربع حوار القاموس المؤقت


Shift+Windows+D
نقرة واحدة : فتح القائمة السريعة لـ DictionaryDisplayLite
نقرتان : فتح البحث وتحرير قاموس النطق مباشرة"""