summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite macht die Verwaltung von NVDA-Sprachwörterbüchern schneller und ruhiger. Es komprimiert Listenausgaben, fügt ein Schnellmenü hinzu und bietet einen benutzerdefinierten Sprachwörterbuch-Editor mit Suche, Validierung und Neuordnung.

Tastenkombinationen:
Control+Shift+D
Einfachklick: Sprachwörterbuch-Dialog öffnen
Doppelklick: Standard-Wörterbuch-Dialog öffnen
Dreifachklick (oder öfters): Dialog für temporäre Wörterbücher öffnen


Shift+Windows+D
Einfachklick: Schnellmenü von DictionaryDisplayLite öffnen
Doppelklick: Suche und Bearbeitung des Sprachwörterbuchs direkt öffnen"""