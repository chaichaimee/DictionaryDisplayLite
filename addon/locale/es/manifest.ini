summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite hace que la gestión de los diccionarios de voz de NVDA sea más rápida y silenciosa. Condensa los anuncios de las listas, añade un menú rápido y proporciona un editor de diccionarios de voz personalizado con búsqueda, validación y reordenación.

Métodos abreviados de teclado:
Control+Shift+D
Un toque : Abrir el diálogo del diccionario de voz
Doble toque : Abrir el diálogo del diccionario predeterminado
Triple toque (o más) : Abrir el diálogo del diccionario temporal


Shift+Windows+D
Un toque : Abrir el menú rápido de DictionaryDisplayLite
Doble toque : Abrir Búsqueda y edición del diccionario de voz directamente"""