summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite rend la gestion des dictionnaires vocaux de NVDA plus rapide et plus silencieuse. Il condense les annonces de listes, ajoute un menu rapide et fournit un éditeur de dictionnaire vocal personnalisé avec recherche, validation et réarrangement.

Raccourcis clavier :
Control+Shift+D
Simple appui : Ouvrir la boîte de dialogue du dictionnaire vocal
Double appui : Ouvrir la boîte de dialogue du dictionnaire par défaut
Triple appui (ou plus) : Ouvrir la boîte de dialogue du dictionnaire temporaire


Shift+Windows+D
Simple appui : Ouvrir le menu rapide de DictionaryDisplayLite
Double appui : Ouvrir directement la recherche et l'édition du dictionnaire vocal"""