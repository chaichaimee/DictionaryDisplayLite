summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite NVDA के स्पीच डिक्शनरी को प्रबंधित करना तेज़ और अधिक शांत बनाता है। यह सूची की घोषणाओं को संक्षिप्त करता है, एक त्वरित मेनू जोड़ता है, और खोज, सत्यापन और पुनः व्यवस्थित करने के साथ एक कस्टम वॉयस डिक्शनरी संपादक प्रदान करता है।

हॉटकीज़ (शॉर्टकट कुंजियाँ):
Control+Shift+D
एकल टैप : वॉयस डिक्शनरी संवाद खोलें
डबल टैप : डिफ़ॉल्ट डिक्शनरी संवाद खोलें
ट्रिपल टैप (या अधिक) : अस्थायी डिक्शनरी संवाद खोलें


Shift+Windows+D
एकल टैप : DictionaryDisplayLite त्वरित मेनू खोलें
डबल टैप : सीधे वॉयस डिक्शनरी खोजें और संपादित करें"""