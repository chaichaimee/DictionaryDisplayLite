summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite membuat pengelolaan kamus ucapan NVDA menjadi lebih cepat dan lebih tenang. Fitur ini memadatkan pengumuman daftar, menambahkan menu cepat, dan menyediakan editor kamus suara kustom dengan pencarian, validasi, dan penyusunan ulang.

Tombol Pintas:
Control+Shift+D
Ketukan Tunggal : Buka dialog kamus Suara
Ketukan Ganda : Buka dialog kamus Default
Ketukan Tiga Kali (atau lebih) : Buka dialog kamus Sementara


Shift+Windows+D
Ketukan Tunggal : Buka menu cepat DictionaryDisplayLite
Ketukan Ganda : Buka Pencarian dan Edit Kamus Suara secara langsung"""