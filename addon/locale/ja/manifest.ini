summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLiteは、NVDAの音声辞書の管理をより高速かつ静かに行えるようにします。リスト読み上げの冗長部分を圧縮し、クイックメニューを追加し、検索、検証、並べ替え機能を備えたカスタム音声辞書エディターを提供します。

ホットキー:
Control+Shift+D
シングルタップ : 音声辞書ダイアログを開く
ダブルタップ : デフォルト辞書ダイアログを開く
トリプルタップ（またはそれ以上） : 一時辞書ダイアログを開く


Shift+Windows+D
シングルタップ : DictionaryDisplayLiteクイックメニューを開く
ダブルタップ : 音声辞書の検索と編集を直接開く"""