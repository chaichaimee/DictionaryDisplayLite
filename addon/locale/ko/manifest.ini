summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite는 NVDA 음성 사전 관리를 더 빠르고 조용하게 만들어 줍니다. 목록 안내를 간소화하고 빠른 메뉴를 추가하며, 검색, 유효성 검사, 재정렬, 개별 항목 사용 또는 사용 안 함 기능이 포함된 사용자 음성 사전 편집기를 제공합니다.

단축키:
Control+Shift+D
한 번 탭: 음성 사전 대화상자 열기
두 번 탭: 기본 사전 대화상자 열기
세 번 이상 탭: 임시 사전 대화상자 열기

Shift+Windows+D
한 번 탭: DictionaryDisplayLite 빠른 메뉴 열기
두 번 탭: 음성 사전 검색 및 편집 직접 열기
세 번 이상 탭: 현재 신디사이저의 음성 사전 유효성 검사

음성 사전 검색 및 편집에서 항목의 컨텍스트 메뉴(응용 프로그램 키)를 열어 사용 또는 사용 안 함으로 설정할 수 있습니다. 사용 안 함으로 설정된 항목은 파일에 맨 앞의 # 기호와 함께 유지되며 음성 출력에 사용되지 않습니다."""