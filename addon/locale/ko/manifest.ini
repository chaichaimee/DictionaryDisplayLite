summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite는 NVDA 음성 사전 관리를 더 빠르고 조용하게 만들어 줍니다. 목록 안내를 간소화하고, 빠른 메뉴를 추가하며, 검색, 유효성 검사 및 재정렬 기능을 갖춘 커스텀 음성 사전 편집기를 제공합니다.

단축키:
Control+Shift+D
한 번 탭하기 : 음성 사전 대화상자 열기
두 번 탭하기 : 기본 사전 대화상자 열기
세 번 이상 탭하기 : 임시 사전 대화상자 열기


Shift+Windows+D
한 번 탭하기 : DictionaryDisplayLite 빠른 메뉴 열기
두 번 탭하기 : 음성 사전 검색 및 편집 직접 열기"""