summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite torna o gerenciamento dos dicionários de fala do NVDA mais rápido e silencioso. Ele condensa os anúncios de listas, adiciona um menu rápido e fornece um editor de dicionário de voz personalizado com pesquisa, validação અને reordenação.

Teclas de Atalho:
Control+Shift+D
Toque Único : Abre a caixa de diálogo do dicionário de voz
Toque Duplo : Abre a caixa de diálogo do dicionário padrão
Triplo Toque (ou mais) : Abre a caixa de diálogo do dicionário temporário


Shift+Windows+D
Toque Único : Abre o menu rápido do DictionaryDisplayLite
Toque Duplo : Abre a Pesquisa e Edição do Dicionário de Voz diretamente"""