summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite делает управление речевыми словарями NVDA быстрее и тише. Он сокращает озвучивание списков, добавляет быстрое меню и предоставляет настраиваемый редактор голосовых словарей с возможностью поиска, проверки и изменения порядка.

Горячие клавиши:
Control+Shift+D
Одиночное касание : Открыть диалог голосового словаря
Двойное касание : Открыть диалог словаря по умолчанию
Тройное касание (или более) : Открыть диалог временного словаря


Shift+Windows+D
Одиночное касание : Открыть быстрое меню DictionaryDisplayLite
Двойное касание : Сразу открыть поиск и редактирование голосового словаря"""