summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite ช่วยให้การจัดการพจนานุกรมเสียงพูดของ NVDA รวดเร็วและเงียบขึ้น โดยจะย่อการประกาศรายการ เพิ่มเมนูด่วน และมีเครื่องมือแก้ไขพจนานุกรมเสียงกำหนดเองพร้อมฟังก์ชันการค้นหา การตรวจสอบ และการจัดเรียงลำดับใหม่

ปุ่มลัด:
Control+Shift+D
แตะครั้งเดียว : เปิดกล่องโต้ตอบพจนานุกรมเสียงพูด
แตะสองครั้ง : เปิดกล่องโต้ตอบพจนานุกรมเริ่มต้น
แตะสามครั้ง (หรือมากกว่า) : เปิดกล่องโต้ตอบพจนานุกรมชั่วคราว


Shift+Windows+D
แตะครั้งเดียว : เปิดเมนูด่วนของ DictionaryDisplayLite
แตะสองครั้ง : เปิดการค้นหาและแก้ไขพจนานุกรมเสียงพูดโดยตรง"""