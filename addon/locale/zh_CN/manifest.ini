summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite 让 NVDA 语音字典的管理更加快速且安静。它精简了列表播报，添加了快捷菜单，并提供了一个带有搜索、验证和重新排序功能的自定义语音字典编辑器。

快捷键：
Control+Shift+D
单击 : 打开“语音字典”对话框
双击 : 打开“默认字典”对话框
三击（或更多次） : 打开“临时字典”对话框


Shift+Windows+D
单击 : 打开 DictionaryDisplayLite 快捷菜单
双击 : 直接打开“搜索和编辑语音字典”"""