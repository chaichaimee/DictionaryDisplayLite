summary = "字典显示精简版 (DictionaryDisplayLite)"
description = """DictionaryDisplayLite 让 NVDA 语音字典的管理更快、更安静。它精简了列表播报、添加了快捷菜单，并提供带有搜索、验证、重新排序以及启用或禁用单个条目功能的自定义语音字典编辑器。

快捷键：
控制键+Shift+D
单击：打开语音字典对话框
双击：打开默认字典对话框
三击（或更多次）：打开临时字典对话框

Shift+Windows+D
单击：打开 DictionaryDisplayLite 快捷菜单
双击：直接打开搜索和编辑语音字典
三击（或更多次）：验证当前合成器的语音字典

在“搜索和编辑语音字典”中，在某个条目上打开上下文菜单（应用程序键）以禁用或启用它。被禁用的条目将以带前导井号（#）的形式保留在文件中，且不会用于语音合成。"""