summary = "字典顯示精簡版"
description = """字典顯示精簡版讓管理 NVDA 語音字典更快且更安靜。它精簡了清單朗讀、新增快速選單，並提供具有搜尋、驗證、重新排序以及啟用或停用個別項目功能的自訂語音字典編輯器。

熱鍵：
Control+Shift+D
單擊：開啟語音字典對話框
雙擊：開啟預設字典對話框
三擊（或更多次）：開啟暫時字典對話框

Shift+Windows+D
單擊：開啟字典顯示精簡版快速選單
雙擊：直接搜尋並編輯語音字典
三擊（或更多次）：驗證目前語音合成器的語音字典

在「搜尋並編輯語音字典」中，對某個項目開啟內容選單（應用程式鍵）以停用或啟用它。被停用的項目會保留在檔案中並以開頭的 # 標示，且不會用於語音。"""