summary = "DictionaryDisplayLite"
description = """DictionaryDisplayLite 讓 NVDA 語音字典的管理更加快速且安靜。它精簡了清單朗读，新增了快捷選單，並提供了一個具備搜尋、驗證和重新排序功能的自訂語音字典編輯器。

快捷鍵：
Control+Shift+D
單擊 : 開啟「語音字典」對話方塊
雙擊 : 開啟「預設字典」對話方塊
三擊（或更多次） : 開啟「暫存字典」對話方塊


Shift+Windows+D
單擊 : 開啟 DictionaryDisplayLite 快捷選單
雙擊 : 直接開啟「搜尋與編輯語音字典」"""